# ═══════════════════════════════════════════════════════════
# WooCommerce PROD — nginx (shop-woo-nginx)  [rasa-comm]
# HTTP :80 → ACME challenge + redirect ke HTTPS
# HTTPS :443 → SSL, serve WordPress
# ═══════════════════════════════════════════════════════════
server {
    listen 80;
    server_name shop.rasakopi.coffee www.shop.rasakopi.coffee;

    # Let Encrypt ACME challenge (harus dilayani via HTTP, tanpa redirect)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # Sisanya redirect ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name shop.rasakopi.coffee www.shop.rasakopi.coffee;
    root /var/www/html;
    index index.php index.html;

    ssl_certificate /etc/letsencrypt/live/shop.rasakopi.coffee/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.rasakopi.coffee/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ── Security headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 128m;

    # ── WC + WP permalinks ──
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # ── WooCommerce REST (admin-ajax.php TIDAK di sini — biarkan masuk location ~ \.php$
    #    agar POST admin-ajax diproses PHP-FPM, bukan 405 Method Not Allowed) ──
    location ~ ^/wp-json/ {
        try_files $uri /index.php?$args;
    }

    # ── Static assets: cache ──
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── PHP via fpm (hardened) ──
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass shop-woo-web:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffering on;
        fastcgi_buffer_size 64k;
        fastcgi_buffers 16 64k;
    }

    # ── Block sensitive files ──
    location ~ /\.env { deny all; }
    location ~ \.(sql|md|log)$ { deny all; }
    location ~ wp-config\.php$ { deny all; }

    # ── Anti webshell: blokir PHP di uploads/media ──
    location ~* ^/wp-content/uploads/.*\.php$ {
        deny all;
    }
    location ~* ^/wp-content/.*\.(phar|phtml)$ {
        deny all;
    }
}
